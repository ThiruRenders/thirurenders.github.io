<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moorthy T — Senior QA Test Engineer</title>
<meta name="description" content="Senior QA Test Engineer with 4.5+ years building reliable, automated, scalable test pipelines across web, API, and mobile." />
<meta name="theme-color" content="#050510">

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050510; --bg-2: #0a0a1a;
    --fg: #e8ecff; --muted: #8a8fb3;
    --accent: #00f0ff; --accent-2: #ff2bd1; --accent-3: #7c5cff;
    --grid: rgba(124, 92, 255, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: 'Space Grotesk', sans-serif;
    overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
  .noise {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    opacity: 0.04; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .grid-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,.9), rgba(0,0,0,0) 70%);
  }
  main { position: relative; z-index: 2; }
  nav {
    position: fixed; top: 0; left: 0; right: 0; padding: 24px 48px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    z-index: 100;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    background: linear-gradient(180deg, rgba(5,5,16,.7), rgba(5,5,16,0));
  }
  .logo { font-family: 'Syncopate', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 4px; color: var(--fg); }
  .logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 32px; list-style: none; flex: 1; justify-content: center; }
  .nav-links a { color: var(--muted); text-decoration: none; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; transition: color .3s; font-family: 'JetBrains Mono', monospace; }
  .nav-links a:hover { color: var(--accent); }
  .nav-links a::before { content: '// '; opacity: .4; }

  .nav-resume {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; background: var(--accent); color: var(--bg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    border-radius: 4px; cursor: pointer; border: none;
    transition: background .25s;
  }
  .nav-resume:hover { background: var(--accent-2); }
  .nav-resume svg { width: 12px; height: 12px; }

  section { padding: 120px 48px; position: relative; }
  .hero {
    min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
    padding: 120px 64px 80px; max-width: 1400px; margin: 0 auto; width: 100%;
    position: relative;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    gap: 64px;
    align-items: center;
    width: 100%; position: relative; z-index: 3;
  }
  .hero-left { min-width: 0; }
  .hero-tag { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 13px; letter-spacing: 4px; margin-bottom: 24px; animation: fadeUp .9s ease-out .15s both; display: inline-flex; align-items: center; gap: 10px; }
  .hero-tag::before { content: ''; width: 28px; height: 1px; background: var(--accent); }

  .hero h1 {
    font-family: 'Syncopate', sans-serif;
    font-size: clamp(34px, 5.4vw, 80px);
    font-weight: 700; line-height: .9; letter-spacing: -2px;
    margin-bottom: 16px; animation: fadeUp 1.1s ease-out .25s both;
    position: relative;
  }
  .hero h1 .name-row { display: inline-flex; align-items: baseline; gap: 0.12em; flex-wrap: nowrap; white-space: nowrap; position: relative; }
  .hero h1 .name-fill {
    background: linear-gradient(135deg, #fff 0%, #d9d4ff 30%, #7c5cff 70%, #00f0ff 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero h1 .name-outline {
    -webkit-text-stroke: 1.5px var(--fg);
    -webkit-text-fill-color: transparent; color: transparent;
    position: relative;
  }
  .hero h1 .name-outline::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 8%; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transform: scaleX(0); transform-origin: left;
    animation: drawLine 1.2s cubic-bezier(.65,.05,.36,1) 1.6s forwards;
    border-radius: 2px;
  }
  @keyframes drawLine { to { transform: scaleX(1); } }
  .hero h1 .dot {
    display: inline-block; width: .14em; height: .14em;
    background: var(--accent); border-radius: 50%; margin-left: .05em;
    vertical-align: baseline;
    box-shadow: 0 0 24px var(--accent), 0 0 48px rgba(0,240,255,.4);
    animation: pulseDot 2s ease-in-out infinite;
  }
  .hero h1 .subline {
    display: block; font-family: 'JetBrains Mono', monospace;
    font-size: clamp(10px, 1vw, 13px); font-weight: 400; letter-spacing: 5px;
    color: var(--muted); margin-top: 20px; padding-left: 2px;
    text-transform: uppercase; line-height: 1;
  }
  .hero h1 .subline::before { content: '['; color: var(--accent); margin-right: 8px; }
  .hero h1 .subline::after { content: ']'; color: var(--accent); margin-left: 8px; }

  .hero h2 {
    font-size: clamp(18px, 2.2vw, 28px); font-weight: 400; color: var(--muted);
    margin: 32px 0 40px; font-family: 'JetBrains Mono', monospace;
    animation: fadeUp .9s ease-out .45s both;
  }
  .hero h2 .accent { color: var(--accent-2); }
  .hero-meta { display: flex; gap: 56px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted); animation: fadeUp .9s ease-out .6s both; padding: 24px 0; border-top: 1px solid rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.06); }
  .hero-meta div span { color: var(--accent); display: block; font-size: 10px; letter-spacing: 2px; margin-bottom: 6px; }

  @keyframes fadeUp { from { opacity: 0; transform: translate3d(0, 30px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  .scroll-hint {
    position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted);
    letter-spacing: 4px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    animation: fadeUp 1s ease-out .9s both;
  }
  .scroll-hint::after { content: ''; width: 1px; height: 32px; background: linear-gradient(to bottom, var(--accent), transparent); animation: scrollPulse 2s ease-in-out infinite; }
  @keyframes scrollPulse { 0%,100% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } }

  /* QA console */
  .qa-console-wrap {
    margin-top: 40px;
    max-width: 100%;
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin; scrollbar-color: rgba(0,240,255,.2) transparent;
  }
  .qa-console-wrap::-webkit-scrollbar { height: 4px; }
  .qa-console-wrap::-webkit-scrollbar-thumb { background: rgba(0,240,255,.2); border-radius: 2px; }
  .qa-console {
    display: inline-flex; align-items: center;
    border: 1px solid rgba(0,240,255,.2);
    background: rgba(5,5,16,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 6px; overflow: hidden;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    white-space: nowrap;
  }
  .qa-console .dot-r { width: 8px; height: 8px; border-radius: 50%; margin: 0 3px; flex-shrink: 0; }
  .qa-console .dots { display: flex; padding: 8px 10px; border-right: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.02); }
  .qa-console .dots .dot-r:nth-child(1) { background: #ff5f57; }
  .qa-console .dots .dot-r:nth-child(2) { background: #febc2e; }
  .qa-console .dots .dot-r:nth-child(3) { background: #28c840; }
  .qa-console .label { padding: 8px 14px; color: var(--muted); border-right: 1px solid rgba(255,255,255,.06); }
  .qa-console .stat-chip { padding: 8px 14px; border-right: 1px solid rgba(255,255,255,.06); color: var(--fg); }
  .qa-console .stat-chip:last-child { border-right: 0; }
  .qa-console .pass { color: #28c840; }
  .qa-console .blink { display: inline-block; width: 6px; height: 12px; background: var(--accent); margin-left: 6px; vertical-align: middle; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Hero CTA */
  .hero-cta { display: flex; gap: 14px; margin-top: 36px; flex-wrap: wrap; animation: fadeUp .9s ease-out .75s both; }

  /* Hero visual (right column) */
  .hero-visual {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1 / 1; max-width: 460px; margin: 0 auto; width: 100%;
    animation: fadeUp 1.2s ease-out .3s both;
  }
  .hero-avatar {
    position: relative;
    width: 78%; aspect-ratio: 1; max-width: 340px;
  }
  .hero-avatar .ring {
    position: absolute; inset: -14px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
    animation: spin 10s linear infinite;
    filter: blur(.5px);
  }
  .hero-avatar .ring::after {
    content: ''; position: absolute; inset: 7px; background: var(--bg); border-radius: 50%;
  }
  .hero-avatar .glow {
    position: absolute; inset: -60px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,240,255,.18), transparent 60%);
    z-index: 0; filter: blur(20px);
  }
  .hero-avatar img {
    position: relative; z-index: 2;
    width: 100%; height: 100%; border-radius: 50%;
    object-fit: cover; object-position: center top;
    box-shadow: 0 30px 80px -20px rgba(0,240,255,.45), 0 0 0 4px var(--bg);
  }

  /* Floating cards around the avatar */
  .float-card {
    position: absolute; z-index: 4;
    background: rgba(10,10,26,.85);
    border: 1px solid rgba(0,240,255,.18);
    border-radius: 12px;
    padding: 14px 18px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-family: 'JetBrains Mono', monospace;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,.5);
    animation: floatY 5s ease-in-out infinite;
  }
  .float-card .label { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
  .float-card .value { font-size: 13px; color: var(--fg); font-weight: 600; display: flex; align-items: center; gap: 8px; line-height: 1.2; }
  .float-card .pulse {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #28c840; box-shadow: 0 0 10px #28c840;
    animation: pulseDot 1.5s ease-in-out infinite; flex-shrink: 0;
  }
  .float-card.status { top: 4%; right: -2%; animation-delay: 0s; }
  .float-card.exp { bottom: 14%; left: -6%; animation-delay: -2.5s; }
  .float-card.stack {
    bottom: -2%; right: 6%; padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
    animation-delay: -1.2s;
  }
  .float-card.stack .stack-icons { display: flex; gap: 8px; }
  .float-card.stack svg { width: 22px; height: 22px; }
  .float-card.stack .stack-label { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }

  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* Hero status bar (bottom of hero) */
  .hero-status-bar {
    position: absolute; bottom: 32px; left: 64px; right: 64px;
    display: flex; align-items: center; gap: 24px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--muted); z-index: 3;
    padding-top: 16px; border-top: 1px solid rgba(255,255,255,.06);
    animation: fadeUp .9s ease-out 1.2s both;
  }
  .hero-status-bar .scroll-arrow {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--accent); letter-spacing: 3px;
  }
  .hero-status-bar .scroll-arrow::after {
    content: ''; width: 1px; height: 20px;
    background: linear-gradient(to bottom, var(--accent), transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }
  .hero-status-bar .spacer { flex: 1; }
  .cta-btn {
    display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--bg); background: var(--accent); border: 1px solid var(--accent);
    text-decoration: none; cursor: pointer;
    transition: background .25s, border-color .25s, transform .15s; position: relative; overflow: hidden;
  }
  .cta-btn:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .cta-btn:active { transform: translateY(1px); }
  .cta-btn.outline { color: var(--fg); background: transparent; border-color: rgba(255,255,255,.2); }
  .cta-btn.outline:hover { background: rgba(0,240,255,.08); border-color: var(--accent); color: var(--accent); }
  .cta-btn svg { width: 14px; height: 14px; }

  /* Section headings */
  .section-num { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent); letter-spacing: 4px; margin-bottom: 16px; }
  .section-title { font-family: 'Syncopate', sans-serif; font-size: clamp(36px, 6vw, 80px); font-weight: 700; letter-spacing: -1px; margin-bottom: 64px; line-height: 1; }
  .section-title .stroke { -webkit-text-stroke: 1px var(--fg); -webkit-text-fill-color: transparent; color: transparent; }

  /* About + Avatar */
  .about-grid { display: grid; grid-template-columns: 380px 1fr; gap: 80px; align-items: start; }
  .avatar-wrap { position: relative; width: 320px; height: 320px; margin: 0 auto; }
  .avatar-ring { position: absolute; inset: -16px; border-radius: 50%; background: conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent)); animation: spin 8s linear infinite; filter: blur(.5px); }
  .avatar-ring::after { content: ''; position: absolute; inset: 8px; background: var(--bg); border-radius: 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .avatar-img {
    position: relative; z-index: 2; width: 100%; height: 100%; border-radius: 50%; display: block;
    object-fit: cover; object-position: center top;
    box-shadow: 0 30px 80px -20px rgba(0,240,255,.4), 0 0 0 4px var(--bg);
    image-rendering: -webkit-optimize-contrast;
  }
  .avatar-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: var(--accent); color: var(--bg);
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 1px; padding: 6px 12px; border-radius: 999px; z-index: 3;
    font-weight: 700; box-shadow: 0 4px 16px rgba(0,240,255,.5);
  }
  .avatar-badge::before {
    content: ''; display: inline-block; width: 6px; height: 6px;
    background: #0a0; border-radius: 50%; margin-right: 6px;
    box-shadow: 0 0 8px #0f0; animation: pulseDot 1.5s ease-in-out infinite;
  }

  .about-text { font-size: 19px; line-height: 1.7; color: var(--muted); font-weight: 300; }
  .about-text strong { color: var(--fg); font-weight: 500; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 32px; }
  .stat { border: 1px solid rgba(255,255,255,.08); padding: 24px; background: rgba(255,255,255,.02); transition: border-color .25s; }
  .stat:hover { border-color: var(--accent); }
  .stat-num { font-family: 'Syncopate', sans-serif; font-size: 44px; font-weight: 700; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-3) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-bottom: 8px; }
  .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }

  /* Skills */
  .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap: 16px; }
  .skill-card { border: 1px solid rgba(255,255,255,.08); padding: 28px; background: rgba(255,255,255,.02); transition: border-color .25s, background .25s; }
  .skill-card:hover { border-color: var(--accent); background: rgba(0,240,255,.04); }
  .skill-card h4 { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; }
  .tool-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tool { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border: 1px solid rgba(255,255,255,.1); border-radius: 999px; font-size: 13px; color: var(--fg); transition: border-color .2s, background .2s; }
  .tool:hover { border-color: rgba(0,240,255,.4); background: rgba(0,240,255,.04); }
  .tool-icon { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tool-icon svg { width: 22px; height: 22px; display: block; }

  /* Timeline */
  .timeline { position: relative; padding-left: 40px; }
  .timeline::before { content: ''; position: absolute; left: 8px; top: 8px; bottom: 0; width: 1px; background: linear-gradient(to bottom, var(--accent), var(--accent-3), transparent); }
  .timeline-item { margin-bottom: 64px; position: relative; }
  .timeline-item::before { content: ''; position: absolute; left: -38px; top: 8px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); box-shadow: 0 0 16px var(--accent); }
  .timeline-date { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); letter-spacing: 2px; margin-bottom: 8px; }
  .timeline-title { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  .timeline-company { color: var(--muted); margin-bottom: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .timeline-points { list-style: none; }
  .timeline-points li { color: var(--muted); margin-bottom: 8px; padding-left: 20px; position: relative; line-height: 1.6; }
  .timeline-points li::before { content: '▹'; position: absolute; left: 0; color: var(--accent); }

  /* Projects */
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px,1fr)); gap: 24px; }
  .project-card { border: 1px solid rgba(255,255,255,.08); background: linear-gradient(135deg, rgba(124,92,255,.04), rgba(0,240,255,.02)); padding: 32px; position: relative; transition: border-color .25s, box-shadow .25s; }
  .project-card:hover { border-color: var(--accent); box-shadow: 0 20px 40px -20px rgba(0,240,255,.15); }
  .project-id { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent-2); letter-spacing: 2px; margin-bottom: 16px; }
  .project-title { font-size: 22px; font-weight: 600; margin-bottom: 16px; line-height: 1.2; }
  .project-sub { color: var(--muted); font-size: 13px; font-weight: 300; font-family: 'JetBrains Mono', monospace; }
  .project-desc { color: var(--muted); font-size: 14px; line-height: 1.7; margin: 16px 0; }
  .project-stack { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .project-stack .tool { padding: 4px 10px 4px 8px; font-size: 11px; }
  .project-stack .tool-icon { width: 14px; height: 14px; }
  .project-stack .tool-icon svg { width: 14px; height: 14px; }
  .project-tags { display: flex; flex-wrap: wrap; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .project-tags span { color: var(--accent); padding: 3px 8px; border: 1px solid rgba(0,240,255,.2); border-radius: 4px; }

  /* Education */
  .edu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .edu-card { border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.02); padding: 32px; transition: border-color .25s; }
  .edu-card:hover { border-color: var(--accent-3); }
  .edu-card h4 { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase; }
  .edu-card .title { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
  .edu-card .sub { color: var(--muted); font-size: 14px; line-height: 1.5; }

  /* Contact */
  .contact { text-align: center; padding: 160px 48px; }
  .contact h2 { font-family: 'Syncopate', sans-serif; font-size: clamp(48px, 10vw, 140px); font-weight: 700; line-height: 0.9; letter-spacing: -2px; margin-bottom: 40px; background: linear-gradient(135deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .contact p { color: var(--muted); font-size: 18px; max-width: 600px; margin: 0 auto 48px; line-height: 1.6; }
  .contact-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .contact-btn { display: inline-flex; align-items: center; gap: 10px; padding: 18px 36px; border: 1px solid var(--accent); color: var(--fg); text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; position: relative; overflow: hidden; transition: color .25s, border-color .25s; z-index: 1; background: transparent; cursor: pointer; }
  .contact-btn::before { content: ''; position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .3s ease; z-index: -1; }
  .contact-btn:hover { color: var(--bg); }
  .contact-btn:hover::before { transform: scaleX(1); }
  .contact-btn.whatsapp { border-color: #25D366; }
  .contact-btn.whatsapp::before { background: #25D366; }
  .contact-btn.phone { border-color: var(--accent-3); }
  .contact-btn.phone::before { background: var(--accent-3); }
  .contact-btn svg { width: 16px; height: 16px; }
  .contact-info { display: flex; justify-content: center; gap: 48px; flex-wrap: wrap; margin-top: 64px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted); }
  .contact-info div span { display: block; color: var(--accent); font-size: 11px; letter-spacing: 2px; margin-bottom: 4px; }
  .copy-toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: var(--bg); padding: 12px 24px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; z-index: 9999; }
  .copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* PDF Modal */
  .pdf-modal {
    position: fixed; inset: 0;
    background: rgba(5,5,16,.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 1500; display: flex; align-items: center; justify-content: center; padding: 24px;
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .pdf-modal.open { opacity: 1; pointer-events: auto; }
  .pdf-modal-card {
    width: 100%; max-width: 920px; height: 100%; max-height: 92vh;
    background: var(--bg); border: 1px solid rgba(0,240,255,.2); border-radius: 8px;
    display: flex; flex-direction: column; overflow: hidden;
    transform: scale(.96); transition: transform .3s ease;
    box-shadow: 0 50px 100px -20px rgba(0,0,0,.6);
  }
  .pdf-modal.open .pdf-modal-card { transform: scale(1); }
  .pdf-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.02); flex-wrap: wrap; gap: 12px; }
  .pdf-modal-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .pdf-modal-title svg { width: 16px; height: 16px; }
  .pdf-modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .pdf-action { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; border-radius: 4px; border: 1px solid rgba(255,255,255,.12); background: transparent; color: var(--fg); transition: all .2s; }
  .pdf-action:hover { border-color: var(--accent); color: var(--accent); }
  .pdf-action.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .pdf-action.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: var(--bg); }
  .pdf-action.danger:hover { border-color: var(--accent-2); color: var(--accent-2); }
  .pdf-action svg { width: 12px; height: 12px; }
  .pdf-frame { flex: 1; width: 100%; background: #1a1a1a; border: 0; }

  footer { padding: 32px 48px; border-top: 1px solid rgba(255,255,255,.06); text-align: center; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px; }

  .loader { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; transition: opacity .5s ease; }
  .loader-text { font-family: 'Syncopate', sans-serif; font-size: 11px; letter-spacing: 6px; color: var(--accent); opacity: .8; }
  .loader-bar { width: 140px; height: 1px; background: rgba(255,255,255,.08); position: relative; overflow: hidden; }
  .loader-bar::after { content: ''; position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); animation: load .6s ease-out forwards; transform-origin: left; }
  @keyframes load { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  @media (max-width: 1024px) {
    .hero-grid { grid-template-columns: 1fr; gap: 48px; }
    .hero-visual { max-width: 360px; margin: 0 auto; }
    .hero-avatar { max-width: 280px; }
    .float-card.status { right: -4%; }
    .float-card.exp { left: -2%; }
  }
  @media (max-width: 900px) { .about-grid { grid-template-columns: 1fr; gap: 48px; } .avatar-wrap { width: 220px; height: 220px; } }
  @media (max-width: 768px) {
    nav { padding: 14px 18px; gap: 8px; }
    .nav-links { display: none; }
    .nav-resume span.txt { display: none; }
    .nav-resume { padding: 8px 10px; }
    section { padding: 80px 24px; }
    .hero { padding: 100px 24px 100px; }
    .hero-grid { gap: 40px; }
    .hero-visual { max-width: 280px; }
    .hero-avatar { max-width: 220px; }
    .float-card { padding: 10px 12px; }
    .float-card .label { font-size: 8px; }
    .float-card .value { font-size: 11px; }
    .float-card.stack svg { width: 18px; height: 18px; }
    .edu-grid { grid-template-columns: 1fr; gap: 16px; }
    .hero-meta { gap: 20px; padding: 16px 0; font-size: 12px; }
    .hero-status-bar { left: 24px; right: 24px; bottom: 24px; font-size: 10px; flex-wrap: wrap; gap: 12px; }
    .hero-status-bar .scroll-arrow::after { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    .avatar-ring { animation: none; }
    .scroll-hint::after { display: none; }
  }
  .reveal { opacity: 0; transform: translate3d(0, 30px, 0); transition: opacity .8s ease-out, transform .8s ease-out; }
  .reveal.in { opacity: 1; transform: translate3d(0, 0, 0); }
</style>

const RESUME_FILENAME = "Moorthy_T_Resume.pdf";

let _resumeBlobUrl = null;
function getResumeBlobUrl() {
  if (_resumeBlobUrl) return _resumeBlobUrl;
  const bin = atob(RESUME_B64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], { type: 'application/pdf' });
  _resumeBlobUrl = URL.createObjectURL(blob);
  return _resumeBlobUrl;
}
function downloadResume() {
  const a = document.createElement('a');
  a.href = getResumeBlobUrl();
  a.download = RESUME_FILENAME;
  document.body.appendChild(a); a.click(); a.remove();
}

const useResume = () => useContext(ResumeCtx);

function ResumeModal({ open, onClose }) {
  const [src, setSrc] = useState(null);
  useEffect(() => {
    if (open) {
      setSrc(getResumeBlobUrl());
      document.body.style.overflow = 'hidden';
      const onKey = (e) => { if (e.key === 'Escape') onClose(); };
      window.addEventListener('keydown', onKey);
      return () => {
        document.body.style.overflow = '';
        window.removeEventListener('keydown', onKey);
      };
    }
  }, [open, onClose]);
  return (
    <div className={`pdf-modal ${open ? 'open' : ''}`} onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="pdf-modal-card">
        <div className="pdf-modal-header">
          <div className="pdf-modal-title">{IconDoc} MOORTHY_T_RESUME.PDF</div>
          <div className="pdf-modal-actions">
            <button className="pdf-action" onClick={() => window.open(getResumeBlobUrl(), '_blank')}>{IconExternal} Open in Tab</button>
            <button className="pdf-action primary" onClick={downloadResume}>{IconDownload} Download</button>
            <button className="pdf-action danger" onClick={onClose}>{IconClose} Close</button>
          </div>
        </div>
        {src && <iframe className="pdf-frame" src={src + '#view=FitH'} title="Moorthy T Resume" />}
      </div>

function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function About() {
  const [counts, setCounts] = useState({ years: 0, projects: 0 });
  const fired = useRef(false);
  useEffect(() => {
    const el = document.getElementById('about');
    if (!el || !('IntersectionObserver' in window)) { setCounts({ years: '4.5', projects: 12 }); return; }
    const io = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !fired.current) {
        fired.current = true;
        const t = { years: 4.5, projects: 12 };
        const start = performance.now();
        const dur = 1600;
        const tick = (now) => {
          const p = Math.min((now - start) / dur, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          setCounts({ years: (t.years * ease).toFixed(1), projects: Math.floor(t.projects * ease) });
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    }, { threshold: 0.3 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <section id="about">
      <div className="section-num reveal">// 01 — ABOUT</div>
      <h2 className="section-title reveal">Quality, <span className="stroke">engineered.</span></h2>

<script>
(function() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isMobile = window.matchMedia('(max-width: 768px)').matches;

  if (!reduced) {
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: !isMobile, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050510, 0.04);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 8;
    const pCount = isMobile ? 350 : 700;
    const positions = new Float32Array(pCount * 3);
    const colors = new Float32Array(pCount * 3);
    const palette = [new THREE.Color(0x00f0ff), new THREE.Color(0xff2bd1), new THREE.Color(0x7c5cff)];
    for (let i = 0; i < pCount; i++) {
      positions[i*3] = (Math.random() - 0.5) * 30;
      positions[i*3+1] = (Math.random() - 0.5) * 30;
      positions[i*3+2] = (Math.random() - 0.5) * 30;
      const c = palette[Math.floor(Math.random()*3)];
      colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
    }
    const pGeom = new THREE.BufferGeometry();
    pGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    pGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const pMat = new THREE.PointsMaterial({ size: 0.04, vertexColors: true, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false });
    const particles = new THREE.Points(pGeom, pMat); scene.add(particles);
    const shapes = [];
    const geos = [new THREE.IcosahedronGeometry(1.2, 0), new THREE.OctahedronGeometry(1, 0), new THREE.TorusGeometry(1, 0.3, 12, 36)];
    const shapeCount = isMobile ? 2 : 3;
    for (let i = 0; i < shapeCount; i++) {
      const mat = new THREE.MeshBasicMaterial({ color: [0x00f0ff, 0xff2bd1, 0x7c5cff][i % 3], wireframe: true, transparent: true, opacity: 0.12 });
      const m = new THREE.Mesh(geos[i % geos.length], mat);
      // Push shapes to edges so they don't crowd content
      const angle = (i / shapeCount) * Math.PI * 2 + Math.PI * 0.25;
      const dist = 11 + Math.random() * 3;
      m.position.set(Math.cos(angle) * dist, Math.sin(angle) * dist * 0.7, (Math.random()-0.5)*4 - 3);
      m.userData = { rx: (Math.random()-0.5)*0.005, ry: (Math.random()-0.5)*0.005, float: Math.random()*Math.PI*2 };
      scene.add(m); shapes.push(m);
    }
    let scrollY = 0;
    window.addEventListener('scroll', () => { scrollY = window.scrollY; }, { passive: true });
    let running = true;
    document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) clock.start(); });
    const clock = new THREE.Clock();
    let lastT = 0;
    function animate() {
      if (!running) { requestAnimationFrame(animate); return; }
      const t = clock.getElapsedTime();
      const dt = Math.min(t - lastT, 0.1);
      lastT = t;
      particles.rotation.y += dt * 0.03;
      particles.rotation.x += dt * 0.01;
      for (let i = 0; i < shapes.length; i++) {
        const s = shapes[i];
        s.rotation.x += s.userData.rx;
        s.rotation.y += s.userData.ry;
        s.position.y += Math.sin(t + s.userData.float) * 0.003;
      }
      const targetY = -scrollY * 0.0015;
      camera.position.y += (targetY - camera.position.y) * 0.05;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
    let resizeT;
    window.addEventListener('resize', () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(() => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }, 120);
    }, { passive: true });
  }
  function hideLoader() {
    const l = document.getElementById('loader');
    if (!l) return;
    l.style.opacity = '0';
    setTimeout(() => l.remove(), 500);
  }
  if (document.fonts && document.fonts.ready) {
    Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 500))]).then(() => requestAnimationFrame(hideLoader));
  } else {
    requestAnimationFrame(hideLoader);
  }
})();
</script>
